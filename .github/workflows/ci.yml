# The suite is fast and has no network, no Ollama and no archive — every test builds its
# own SQLite in a tmpdir. So CI can be exactly what a contributor runs locally, and a
# green tick here means the safety properties still hold: tier scope, quote grounding,
# and the filters that must be applied before ranking.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The transcription backends (mlx-whisper, faster-whisper) pull torch-sized
      # wheels and nothing under test touches them, so the package's own dependencies
      # are deliberately not installed here. Tests import plaudvault modules directly.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff numpy httpx fastapi pillow "mcp>=1.2"
      - name: Lint
        # scripts/ too: the docs hook runs sync-docs.py on every commit, and an f-string
        # backslash in it parsed on 3.13 and was a syntax error on the 3.11 this project
        # claims to support. Nothing caught that because nothing linted the directory.
        run: ruff check plaudvault tests scripts
      - name: Test
        run: pytest
