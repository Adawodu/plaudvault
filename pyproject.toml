[project]
name = "plaudvault"
version = "0.1.0"
description = "Own your Plaud recordings: local archive, local transcription, local summaries, Obsidian notes."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "av>=13.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "keyring>=25.0",
    # Apple Silicon gets the GPU backend automatically; everyone else uses
    # faster-whisper, which runs on CPU anywhere and CUDA where available.
    "mlx-whisper>=0.4.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "faster-whisper>=1.0; sys_platform != 'darwin' or platform_machine != 'arm64'",
]

[project.optional-dependencies]
# Force the portable backend on a Mac, e.g. to reproduce what Linux users see.
portable = ["faster-whisper>=1.0"]
# Speaker diarization. Kept optional because it pulls torch and pyannote (~2 GB) and
# needs a HuggingFace licence accepted for the gated models — a real cost to impose on
# somebody who only wants transcripts. Everything else works without it.
speakers = ["pyannote.audio>=3.1"]
# Serve the archive to MCP clients: `plaudctl mcp`.
mcp = ["mcp>=1.2"]
# Everything needed to run the suite and the linter from a fresh clone. The tests
# cover the safety properties — tier scope, quote grounding — so "I could not run the
# tests" must never be the reason a change ships unchecked.
dev = ["pytest>=8.0", "ruff>=0.6", "mcp>=1.2"]

[project.scripts]
plaudctl = "plaudvault.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["plaudvault"]

[tool.hatch.build.targets.wheel.force-include]
"plaudvault/static" = "plaudvault/static"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Deliberately narrow. This codebase explains itself in prose and the linter is here to
# catch what a reader cannot — an unused import, a shadowed name, a bare except — not to
# have opinions about how it reads.
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",   # line length is advisory here; the comments carry the argument
    "B008",   # FastAPI/Typer-style defaults in signatures are the documented idiom
    "E702",   # `path = tmp / "x"; path.mkdir()` — a deliberate idiom in test setup
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
